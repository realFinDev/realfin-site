<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a guest post reaches the site</title>
  <desc id="d">A guest writes in the editor after signing in with GitHub. The post is saved in the guest's own fork and submitted as a pull request. An automatic check blocks changes outside the posts folder and broken builds. The editor reviews and merges it, and Cloudflare publishes it.</desc>
  <rect width="760" height="250" rx="14" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b6e4f"/></marker>
  </defs>
  <g text-anchor="middle">
    <rect x="18" y="80" width="118" height="70" rx="10" fill="#f3f1ec" stroke="#cfc9bd"/>
    <text x="77" y="108" font-size="13" font-weight="bold" fill="#1d1d1f">Guest</text>
    <text x="77" y="126" font-size="11" fill="#5f6368">/admin/, signs in</text>
    <text x="77" y="140" font-size="11" fill="#5f6368">with GitHub</text>

    <rect x="166" y="80" width="118" height="70" rx="10" fill="#f3f1ec" stroke="#cfc9bd"/>
    <text x="225" y="108" font-size="13" font-weight="bold" fill="#1d1d1f">Their fork</text>
    <text x="225" y="126" font-size="11" fill="#5f6368">drafts saved in</text>
    <text x="225" y="140" font-size="11" fill="#5f6368">the guest's copy</text>

    <rect x="314" y="80" width="118" height="70" rx="10" fill="#e3f2ec" stroke="#0b6e4f"/>
    <text x="373" y="108" font-size="13" font-weight="bold" fill="#1d1d1f">Pull request</text>
    <text x="373" y="126" font-size="11" fill="#5f6368">a suggestion,</text>
    <text x="373" y="140" font-size="11" fill="#5f6368">not a change</text>

    <rect x="462" y="80" width="130" height="70" rx="10" fill="#e3f2ec" stroke="#0b6e4f"/>
    <text x="527" y="102" font-size="13" font-weight="bold" fill="#1d1d1f">Automatic check</text>
    <text x="527" y="120" font-size="11" fill="#5f6368">only posts/images?</text>
    <text x="527" y="134" font-size="11" fill="#5f6368">builds? tests pass?</text>

    <rect x="622" y="80" width="120" height="70" rx="10" fill="#e3f2ec" stroke="#0b6e4f"/>
    <text x="682" y="108" font-size="13" font-weight="bold" fill="#1d1d1f">Editor review</text>
    <text x="682" y="126" font-size="11" fill="#5f6368">merge → live</text>
    <text x="682" y="140" font-size="11" fill="#5f6368">in ~1 minute</text>
  </g>
  <g stroke="#0b6e4f" stroke-width="2.2" fill="none" marker-end="url(#a)">
    <path d="M136 115 H162"/>
    <path d="M284 115 H310"/>
    <path d="M432 115 H458"/>
    <path d="M592 115 H618"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="527" y="180" fill="#b3261e">✕ touches ads.txt, code or config → blocked</text>
    <text x="380" y="222" fill="#5f6368">Guests never get write access to the site's repository.</text>
  </g>
</svg>
