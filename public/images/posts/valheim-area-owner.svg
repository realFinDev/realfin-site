<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Who simulates an area in Valheim multiplayer</title>
  <desc id="d">The first player to arrive in an area owns it: their PC simulates the mobs and physics there and sends updates through the dedicated server to the other players. If that player has a slow connection, everyone nearby sees lag. Separately, the server caps how much it sends per player, which Better Networking raises.</desc>
  <rect width="760" height="320" rx="14" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b6e4f"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  </defs>
  <ellipse cx="190" cy="160" rx="165" ry="120" fill="#e3f2ec" stroke="#0b6e4f" stroke-dasharray="6 4"/>
  <text x="190" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b6e4f">The base area</text>
  <text x="190" y="80" text-anchor="middle" font-size="11" fill="#5f6368">mobs, physics, dropped items</text>
  <g text-anchor="middle">
    <rect x="70" y="115" width="140" height="56" rx="10" fill="#fdecea" stroke="#b3261e"/>
    <text x="140" y="138" font-size="13" font-weight="bold" fill="#1d1d1f">Player B</text>
    <text x="140" y="156" font-size="11" fill="#b3261e">arrived first, weak Wi-Fi</text>
    <rect x="160" y="200" width="140" height="56" rx="10" fill="#f3f1ec" stroke="#cfc9bd"/>
    <text x="230" y="223" font-size="13" font-weight="bold" fill="#1d1d1f">Player A</text>
    <text x="230" y="241" font-size="11" fill="#5f6368">sees mobs jump around</text>

    <rect x="420" y="120" width="150" height="66" rx="10" fill="#e3f2ec" stroke="#0b6e4f"/>
    <text x="495" y="146" font-size="13" font-weight="bold" fill="#1d1d1f">Dedicated server</text>
    <text x="495" y="166" font-size="11" fill="#5f6368">relays + saves the world</text>

    <rect x="610" y="200" width="130" height="56" rx="10" fill="#f3f1ec" stroke="#cfc9bd"/>
    <text x="675" y="223" font-size="13" font-weight="bold" fill="#1d1d1f">Player C</text>
    <text x="675" y="241" font-size="11" fill="#5f6368">far away</text>
  </g>
  <g stroke-width="2.2" fill="none">
    <path d="M210 140 C 300 120, 350 130, 416 145" stroke="#b3261e" marker-end="url(#w)"/>
    <path d="M440 186 C 400 215, 350 228, 304 228" stroke="#0b6e4f" marker-end="url(#a)"/>
    <path d="M570 160 C 620 165, 660 180, 672 196" stroke="#0b6e4f" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#5f6368" text-anchor="middle">
    <text x="310" y="114">B's PC sends the area's updates</text>
    <text x="372" y="245">relayed to A</text>
    <text x="495" y="215">server send cap per player:</text>
    <text x="495" y="231">~150 KB/s → up to 1 MB/s</text>
    <text x="495" y="247">with Better Networking</text>
    <text x="380" y="300">Fix both: raise the server's cap, and let the player with the best connection go first.</text>
  </g>
</svg>
