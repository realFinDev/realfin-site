# Weekly check of all links on the live site (internal and external).
# Opens (or updates) a GitHub issue when links are broken, so link rot doesn't go unnoticed.
name: Weekly link check

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci && npm run build

      - name: Check links in the built site
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --exclude-path dist/admin
            --exclude '^https://realfin\.dev/cdn-cgi/'
            --exclude '^https://github\.com/realFinDev/realfin-site/edit/'
            --accept 200,204,206,301,302,308,403,429
            --max-retries 2
            'dist/**/*.html'
          output: ./lychee-report.md
          fail: false

      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found by the weekly check
          content-filepath: ./lychee-report.md
          labels: maintenance
